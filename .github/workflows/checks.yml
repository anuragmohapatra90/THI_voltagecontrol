name: Grid Lab checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt nbformat==5.10.4 playwright==1.55.0
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Verify launcher, physical comparisons, and browser layout
        env:
          GRID_LAB_BROWSER_CHECK: '1'
          GRID_LAB_SCREENSHOT_LOG: '1'
        run: python scripts/validate_project.py

