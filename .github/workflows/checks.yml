name: Grid Lab checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt nbformat==5.10.4
      - name: Verify Git refresh, launcher, and SimBench physics
        run: python scripts/validate_project.py
